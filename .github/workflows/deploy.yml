name: Deploy

# Выкатывает master на сервер: заходит по ssh и запускает scripts/deploy-on-server.sh,
# который забирает свежий код из этого же репозитория и пересобирает контейнер.
#
# Нужные секреты репозитория (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST        адрес сервера
#   DEPLOY_USER        пользователь ssh
#   DEPLOY_KEY         приватный ключ, публичная часть которого лежит
#                      в ~/.ssh/authorized_keys на сервере
#   DEPLOY_PORT        необязательно, по умолчанию 22

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Выкатить на сервер
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Проверить наличие секретов
        run: |
          missing=""
          [ -n "${{ secrets.DEPLOY_HOST }}" ] || missing="$missing DEPLOY_HOST"
          [ -n "${{ secrets.DEPLOY_USER }}" ] || missing="$missing DEPLOY_USER"
          [ -n "${{ secrets.DEPLOY_KEY }}" ] || missing="$missing DEPLOY_KEY"
          if [ -n "$missing" ]; then
            echo "Не заданы секреты репозитория:$missing"
            echo "Добавьте их в Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Деплой по ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 12m
          script: |
            bash /opt/todo-api/scripts/deploy-on-server.sh

      - name: Проверить, что сервис отвечает снаружи
        run: |
          BASE="http://${{ secrets.DEPLOY_HOST }}:8000"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/openapi.json" || echo 000)
          echo "GET /openapi.json -> $code"
          [ "$code" = "200" ] || exit 1

          docs=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/docs" || echo 000)
          echo "GET /docs         -> $docs"
          [ "$docs" = "200" ] || exit 1

          # PATCH появился во второй версии контракта: если его нет,
          # значит выкатился старый код
          curl -s --max-time 10 "$BASE/openapi.json" \
            | grep -q '"/api/v1/todos/{todo_id}"' || {
              echo "В контракте нет /api/v1/todos/{todo_id}"; exit 1; }
          echo "Контракт на месте"
