<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo API - Вход</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h1>📝 Todo API</h1>
            <p class="subtitle">Учебный REST API для управления задачами</p>
            
            <!-- Формы переключаются -->
            <div id="login-form">
                <h2>Вход</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Пароль</label>
                        <input type="password" id="login-password" required placeholder="Введите пароль">
                    </div>
                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>
                <p class="switch-link">
                    Нет аккаунта? <a href="#" onclick="toggleForm(); return false;">Зарегистрироваться</a>
                </p>
            </div>
            
            <div id="register-form" style="display: none;">
                <h2>Регистрация</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-username">Имя пользователя</label>
                        <input type="text" id="reg-username" required minlength="3" maxlength="50" placeholder="johndoe">
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Пароль</label>
                        <input type="password" id="reg-password" required minlength="6" maxlength="100" placeholder="Минимум 6 символов">
                    </div>
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                </form>
                <p class="switch-link">
                    Уже есть аккаунт? <a href="#" onclick="toggleForm(); return false;">Войти</a>
                </p>
            </div>
            
            <div id="message" class="message" style="display: none;"></div>
        </div>
        
        <div class="api-links">
            <h3>📚 Документация API</h3>
            <ul>
                <li><a href="/docs" target="_blank">Swagger UI</a> — интерактивное тестирование API</li>
                <li><a href="/redoc" target="_blank">ReDoc</a> — красивая документация</li>
                <li><a href="/docs-files/sql-examples.md" target="_blank">SQL примеры</a> — примеры SQL запросов</li>
            </ul>
        </div>
    </div>
    
    <script>
        const API_URL = window.location.origin;
        
        function toggleForm() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }
        
        function showMessage(text, type = 'error') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message message-${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const response = await fetch(`${API_URL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка входа');
                }
                
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                showMessage('Вход выполнен! Перенаправление...', 'success');
                
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
                
            } catch (error) {
                showMessage(error.message);
            }
        }
        
        async function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            
            try {
                const response = await fetch(`${API_URL}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка регистрации');
                }
                
                showMessage('Регистрация успешна! Теперь войдите.', 'success');
                
                setTimeout(() => {
                    toggleForm();
                }, 1500);
                
            } catch (error) {
                showMessage(error.message);
            }
        }
        
        // Проверка, если пользователь уже авторизован
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
